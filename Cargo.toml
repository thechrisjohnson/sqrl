[package]
name = "sqrl"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.37", features = ["derive"] }
reqwest = { version = "0.12.15", features = ["json"] }
rpassword = "7.4.0"
sqrl-client = "0.1.0"
tokio = { version = "1.44.2", features = ["full"] }

[patch.crates-io]
sqrl-client = { path = "../sqrl-client" }
sqrl-protocol = { path = "../sqrl-protocol" }
